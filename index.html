<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#311b5c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >
  <meta
    name="apple-mobile-web-app-title"
    content="PD Attendance"
  >

  <title>Purple Dragon Attendance</title>

  <link
    rel="manifest"
    href="./manifest.webmanifest"
  >
  <link
    rel="apple-touch-icon"
    href="./icon-192.png"
  >
  <link
    rel="stylesheet"
    href="./styles.css"
  >
</head>
<body>
  <main class="app-shell">

    <header class="statusbar">
      <div>
        <strong>Purple Dragon Attendance</strong>
        <div class="subtle">
          Offline attendance
        </div>
      </div>

      <div class="status-right">
        <span
          id="connectionBadge"
          class="badge"
        >Checking…</span>

        <span
          id="pendingBadge"
          class="badge"
        >0 pending</span>
      </div>
    </header>

    <section
      id="pinScreen"
      class="screen active"
    >
      <h1>Enter Your Number</h1>

      <div
        id="pinDisplay"
        class="pin-display"
      >_ _ _</div>

      <div
        class="keypad"
        aria-label="Student number keypad"
      >
        <button data-digit="1">1</button>
        <button data-digit="2">2</button>
        <button data-digit="3">3</button>
        <button data-digit="4">4</button>
        <button data-digit="5">5</button>
        <button data-digit="6">6</button>
        <button data-digit="7">7</button>
        <button data-digit="8">8</button>
        <button data-digit="9">9</button>
        <button
          id="clearBtn"
          class="secondary"
        >Clear</button>
        <button data-digit="0">0</button>
        <button
          class="secondary"
          disabled
          aria-hidden="true"
        ></button>
      </div>

      <div
        id="pinMessage"
        class="message"
      ></div>

      <button
        id="showLocalBtn"
        class="admin-link"
      >
        Device / Sync Status
      </button>
    </section>


    <section
      id="confirmScreen"
      class="screen"
    >
      <h1>Is this you?</h1>

      <div
        id="confirmName"
        class="student-name"
      ></div>

      <div
        id="confirmPin"
        class="subtle"
      ></div>

      <div class="actions">
        <button
          id="cancelConfirmBtn"
          class="secondary large"
        >No</button>

        <button
          id="confirmBtn"
          class="primary large"
        >Yes, Sign In</button>
      </div>
    </section>


    <section
      id="successScreen"
      class="screen"
    >
      <div class="success-mark">✓</div>
      <h1>Signed In</h1>

      <div
        id="successName"
        class="student-name"
      ></div>

      <div class="subtle">
        Saved on this device.
      </div>

      <div
        id="syncHint"
        class="message"
      ></div>
    </section>


    <section
      id="localScreen"
      class="screen"
    >
      <h1>Device / Sync Status</h1>

      <div class="panel">
        <div>
          <strong>Students stored:</strong>
          <span id="studentCount">0</span>
        </div>

        <div>
          <strong>Attendance stored:</strong>
          <span id="attendanceCount">0</span>
        </div>

        <div>
          <strong>Pending sync:</strong>
          <span id="pendingCount">0</span>
        </div>

        <div>
          <strong>Roster last updated:</strong>
          <span id="rosterSyncValue">Never</span>
        </div>

        <div>
          <strong>Attendance last synced:</strong>
          <span id="attendanceSyncValue">Never</span>
        </div>
      </div>

      <div class="actions wrap">
        <button
          id="syncNowBtn"
          class="primary"
        >Sync Now</button>

        <button
          id="clearAttendanceBtn"
          class="danger"
        >Clear Attendance</button>

        <button
          id="backBtn"
          class="secondary"
        >Back</button>
      </div>

      <div
        id="localMessage"
        class="message"
      ></div>

      <div
        id="recentAttendance"
        class="recent-list"
      ></div>
    </section>

  </main>

  <script src="./config.js"></script>
  <script src="./db.js"></script>
  <script src="./app.js"></script>
</body>
</html>
